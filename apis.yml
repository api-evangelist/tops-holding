name: Tops Friendly Markets
description: >-
  Tops Friendly Markets is a regional supermarket chain operating 147 stores
  across upstate New York, northern Pennsylvania, and Vermont. The company
  provides an e-commerce platform with online grocery ordering, pickup and
  delivery services via DoorDash, the BonusPlus loyalty card program with
  digital coupons, gas rewards, and the MoolahVille cash back rewards program.
  Tops offers mobile apps for iOS and Android supporting contactless shopping,
  weekly ad browsing, digital coupon clipping, and order management.
  No public developer API is available.
