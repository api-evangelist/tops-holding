name: Tops Friendly Markets
description: >-
  Tops Friendly Markets is a regional supermarket chain headquartered in
  Amherst, New York operating 152 grocery stores and 58 gas station and
  convenience stores across upstate New York, northern Pennsylvania, and
  Vermont. In November 2021 Tops Holding II merged with Price Chopper /
  Market 32 to form Northeast Grocery Inc, a roughly 300-store regional
  alliance under common ownership. The Tops consumer brand continues to
  operate an e-commerce platform with online grocery pickup and DoorDash
  delivery, the BonusPlus loyalty card program with digital coupons and
  gas rewards, the MoolahVille cash back rewards program, in-store
  pharmacies, gift cards, and iOS and Android mobile apps. Vendor and
  supplier engagement is handled through Northeast Shared Services. No
  public developer API, OpenAPI specification, SDK, webhook, EDI portal,
  status page, RSS feed, or changelog is published for the Tops brand.
